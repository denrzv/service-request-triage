spring:
  application:
    name: service-request-triage

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

logging:
  structured:
    format:
      console: logstash

# Versioned synthetic taxonomy/policy definitions (FEATURE-003). Locations accept classpath: or file:
# resources; publishing a new policy means adding a file and changing these values, not code.
triage:
  definitions:
    taxonomy-locations: classpath:taxonomy/v1.json
    policy-locations: classpath:policy/v1.json
    active-policy-version: v1

  # Provider adapters stay disabled by default and read secrets from environment
  # variables only (see .env.example).
  jev:
    enabled: false
    api-key: ${JEV_API_KEY:}
    base-url: https://api.typesafe.ai
    model: jev-latest
    connect-timeout: 5s
    request-timeout: 30s
    max-attempts: 3
    initial-backoff: 200ms
    max-backoff: 2s
  deepseek:
    enabled: false
    api-key: ${DEEPSEEK_API_KEY:}
