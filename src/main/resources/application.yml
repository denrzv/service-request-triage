spring:
  application:
    name: service-request-triage

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

logging:
  structured:
    format:
      console: logstash

# Provider adapters arrive in later tickets. They stay disabled by default and read
# secrets from environment variables only (see .env.example).
triage:
  jev:
    enabled: false
    api-key: ${JEV_API_KEY:}
    base-url: https://api.typesafe.ai
    model: jev-latest
    connect-timeout: 5s
    request-timeout: 30s
    max-attempts: 3
    initial-backoff: 200ms
    max-backoff: 2s
  deepseek:
    enabled: false
    api-key: ${DEEPSEEK_API_KEY:}
