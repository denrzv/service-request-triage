spring:
  application:
    name: service-request-triage

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

logging:
  structured:
    format:
      console: logstash

# Provider adapters arrive in later tickets. They stay disabled by default and read
# secrets from environment variables only (see .env.example).
triage:
  jev:
    enabled: false
    api-key: ${JEV_API_KEY:}
  deepseek:
    enabled: false
    api-key: ${DEEPSEEK_API_KEY:}
